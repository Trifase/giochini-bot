<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reindirizzamento Statistiche Giocatore...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player');
        let dest = '/giochini/?tab=giocatori';
        if (player) {
            dest += '&player=' + encodeURIComponent(player);
        }
        window.location.replace(dest);
    </script>
    <meta http-equiv="refresh" content="1;url=/giochini/?tab=giocatori">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div>
        <h2>Reindirizzamento alla nuova dashboard...</h2>
        <p><a href="/giochini/?tab=giocatori">Clicca qui se non vieni reindirizzato automaticamente</a></p>
    </div>
</body>
</html>
