<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochini Admin Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        [v-cloak] { display: none; }
        body { font-family: Inter, system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="app" v-cloak class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
        <div>
            <div class="flex items-center gap-2.5">
                <span class="text-2xl">📊</span>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight">Giochini Admin Analytics</h1>
            </div>
            <p class="text-xs text-slate-400 mt-1">Insight su comandi, callback, giocate e fasce orarie</p>
        </div>
        <div v-if="authenticated" class="flex items-center gap-2 flex-wrap">
            <select v-model.number="days" @change="fetchOverview" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm font-semibold">
                <option :value="7">Ultimi 7 giorni</option>
                <option :value="30">Ultimi 30 giorni</option>
                <option :value="90">Ultimi 90 giorni</option>
            </select>
            <button @click="fetchOverview" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-bold transition">
                🔄 Aggiorna
            </button>
            <button @click="logout" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">
                Esci
            </button>
        </div>
    </header>

    <!-- Login Gate -->
    <div v-if="!authenticated" class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 mt-12">
        <h2 class="text-lg font-bold">Accesso Admin</h2>
        <p class="text-xs text-slate-400">Inserisci il token admin (`ADMIN_DASHBOARD_TOKEN` oppure il tuo `ADMIN_ID`).</p>
        <form @submit.prevent="login" class="space-y-3">
            <input v-model="tokenInput" type="password" placeholder="Admin token..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            <p v-if="authError" class="text-xs text-rose-400 font-semibold">{{ authError }}</p>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-bold transition">
                Accedi
            </button>
        </form>
    </div>

    <!-- Dashboard -->
    <template v-else-if="data">
        <!-- KPIs -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">Utenti Attivi (DAU / WAU / MAU)</div>
                <div class="text-2xl font-black mt-1 text-indigo-400">
                    {{ data.kpis.dau_today }} <span class="text-slate-600">/</span> {{ data.kpis.wau_7d }} <span class="text-slate-600">/</span> {{ data.kpis.mau_30d }}
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">Comandi (Oggi / {{ days }}g)</div>
                <div class="text-2xl font-black mt-1 text-sky-400">
                    {{ data.kpis.commands_today }} <span class="text-slate-600">/</span> {{ data.kpis.commands_period }}
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">Callback & Giocate ({{ days }}g)</div>
                <div class="text-2xl font-black mt-1 text-emerald-400">
                    {{ data.kpis.callbacks_period }} <span class="text-slate-600">/</span> {{ data.kpis.scores_period }}
                </div>
            </div>
            <div @click="focusErrors" class="bg-slate-900 border border-slate-800 hover:border-rose-500/40 rounded-2xl p-4 cursor-pointer transition">
                <div class="text-xs text-slate-400 font-semibold">Errori ({{ days }}g) — clicca per dettagli</div>
                <div class="text-2xl font-black mt-1" :class="data.kpis.errors_period > 0 ? 'text-rose-400' : 'text-slate-300'">
                    {{ data.kpis.errors_period }}
                </div>
            </div>
        </section>

        <!-- Daily Trend -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <h2 class="text-base font-bold">Andamento Giornaliero</h2>
                <div class="flex items-center gap-4 text-xs text-slate-400">
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-sky-500"></span> Comandi</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-500"></span> Giocate</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-amber-400"></span> Callback</span>
                </div>
            </div>
            <div class="flex items-end gap-1 h-40 pt-4 overflow-x-auto">
                <div v-for="d in data.daily_series" :key="d.date" class="flex-1 min-w-[10px] flex flex-col items-center gap-0.5 h-full justify-end group relative"
                     :title="`${d.date}: ${d.commands} comandi, ${d.callbacks} callback, ${d.scores} giocate (${d.active_users} utenti)`">
                    <div class="w-full flex flex-col justify-end gap-[1px] h-full">
                        <div class="w-full bg-amber-400/80 rounded-t-sm" :style="{ height: barHeight(d.callbacks) }"></div>
                        <div class="w-full bg-sky-500/90" :style="{ height: barHeight(d.commands) }"></div>
                        <div class="w-full bg-emerald-500/80 rounded-b-sm" :style="{ height: barHeight(d.scores) }"></div>
                    </div>
                </div>
            </div>
            <div class="flex justify-between text-[10px] font-mono text-slate-500">
                <span>{{ data.daily_series[0]?.date }}</span>
                <span>{{ data.daily_series[data.daily_series.length - 1]?.date }}</span>
            </div>
        </section>

        <!-- Top Commands & Top Callbacks -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <h2 class="text-base font-bold mb-3">Comandi più usati</h2>
                <div v-if="!data.top_commands.length" class="text-xs text-slate-500">Nessun comando registrato nel periodo.</div>
                <div v-else class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    <div v-for="c in data.top_commands" :key="c.name"
                         @click="selectCommand(c.name, 'command')"
                         class="flex items-center justify-between bg-slate-950/60 hover:bg-slate-800/60 border border-slate-800/80 rounded-xl px-3.5 py-2 text-sm cursor-pointer transition"
                         :class="selectedCommand && selectedCommand.name === c.name && selectedCommand.event_type === 'command' ? 'border-sky-500/60 bg-sky-950/30' : ''">
                        <span class="font-mono font-bold text-sky-300">{{ c.name }}</span>
                        <div class="flex items-center gap-3 text-xs text-slate-400">
                            <span>{{ c.unique_users }} utenti</span>
                            <span class="font-bold text-slate-100 bg-slate-800 px-2 py-0.5 rounded-lg">{{ c.count }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <h2 class="text-base font-bold mb-3">Interazioni UI (Callback)</h2>
                <div v-if="!data.top_callbacks.length" class="text-xs text-slate-500">Nessuna callback registrata nel periodo.</div>
                <div v-else class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    <div v-for="cb in data.top_callbacks" :key="cb.name"
                         @click="selectCommand(cb.name, 'callback')"
                         class="flex items-center justify-between bg-slate-950/60 hover:bg-slate-800/60 border border-slate-800/80 rounded-xl px-3.5 py-2 text-sm cursor-pointer transition"
                         :class="selectedCommand && selectedCommand.name === cb.name && selectedCommand.event_type === 'callback' ? 'border-amber-500/60 bg-amber-950/30' : ''">
                        <span class="font-mono font-bold text-amber-300">{{ cb.name }}</span>
                        <div class="flex items-center gap-3 text-xs text-slate-400">
                            <span>{{ cb.unique_users }} utenti</span>
                            <span class="font-bold text-slate-100 bg-slate-800 px-2 py-0.5 rounded-lg">{{ cb.count }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Selected Command / Callback Drilldown -->
        <section v-if="selectedCommand" id="command-events-panel" class="bg-slate-900 border border-sky-500/40 rounded-2xl p-5 space-y-3">
            <div class="flex items-center justify-between gap-2">
                <div>
                    <h2 class="text-base font-bold text-sky-300">Dettaglio {{ selectedCommand.event_type === 'command' ? 'Comando' : 'Callback' }}: <span class="font-mono">{{ selectedCommand.name }}</span></h2>
                    <p class="text-xs text-slate-400">Chi lo ha usato negli ultimi {{ days }} giorni ({{ commandEvents.length }} utilizzi)</p>
                </div>
                <button @click="selectedCommand = null" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">✕ Chiudi</button>
            </div>
            <div v-if="loadingCommandEvents" class="text-xs text-slate-400 py-3">Caricamento...</div>
            <div v-else-if="!commandEvents.length" class="text-xs text-slate-500 py-2">Nessun utilizzo trovato.</div>
            <div v-else class="overflow-x-auto max-h-96 overflow-y-auto">
                <table class="w-full text-xs text-left">
                    <thead class="text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="py-2">Data / Ora</th>
                            <th class="py-2">Utente</th>
                            <th class="py-2">Dettaglio / Argomenti</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60">
                        <tr v-for="(ev, idx) in commandEvents" :key="idx" class="hover:bg-slate-800/40">
                            <td class="py-2 font-mono text-slate-400 whitespace-nowrap pr-4">{{ ev.time_str }}</td>
                            <td class="py-2 pr-4">
                                <button v-if="ev.user_id" @click="selectUser({ user_id: ev.user_id, name: ev.user_name })" class="font-semibold text-indigo-300 hover:underline">{{ ev.user_name }}</button>
                                <span v-else class="text-slate-300">{{ ev.user_name }}</span>
                            </td>
                            <td class="py-2 font-mono text-slate-300">{{ ev.detail || '—' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Hourly Heatmap -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 overflow-x-auto">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="text-base font-bold">Heatmap Oraria (Giorno × 30 min)</h2>
                <div class="flex items-center gap-1.5 text-[10px] text-slate-400 font-mono">
                    <span>0</span>
                    <span class="w-3 h-3 rounded-sm border border-slate-800" style="background-color: #05070c;" title="0 eventi"></span>
                    <span v-for="(col, idx) in heatPalette" :key="idx" class="w-3 h-3 rounded-sm" :style="{ backgroundColor: col }" :title="`Livello ${idx + 1}/10`"></span>
                    <span>max ({{ maxHeatVal }})</span>
                </div>
            </div>
            <div class="min-w-[780px] space-y-1">
                <div class="grid grid-cols-[48px_repeat(48,minmax(0,1fr))] gap-0.5 text-[10px] font-mono text-slate-500 text-center">
                    <span></span>
                    <span v-for="s in 48" :key="s">{{ (s - 1) % 2 === 0 ? String((s - 1) / 2).padStart(2, '0') : '' }}</span>
                </div>
                <div v-for="(row, dIdx) in data.hourly_heatmap" :key="dIdx" class="grid grid-cols-[48px_repeat(48,minmax(0,1fr))] gap-0.5 items-center">
                    <span class="text-xs font-semibold text-slate-400">{{ dayLabels[dIdx] }}</span>
                    <div v-for="(val, sIdx) in row" :key="sIdx"
                         class="h-6 rounded-sm transition"
                         :style="{ backgroundColor: heatColor(val) }"
                         :title="`${dayLabels[dIdx]} ${slotLabel(sIdx)} — ${val} eventi`">
                    </div>
                </div>
            </div>
        </section>

        <!-- Bonus & New Games Effectiveness -->
        <section v-if="data.bonus_effectiveness" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                    <h2 class="text-base font-bold">Efficacia Giochi Bonus &amp; Nuovi Giochi</h2>
                    <p class="text-xs text-slate-400">Confronto giocate medie giornaliere nei giorni bonus/nuovi vs giorni normali nel periodo</p>
                </div>
                <div v-if="data.bonus_effectiveness.summary.total_bonus_days" class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 font-mono">
                        Bonus: <strong class="text-amber-300">{{ data.bonus_effectiveness.summary.avg_bonus_overall }}/g</strong>
                    </span>
                    <span class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 font-mono">
                        Normale: <strong class="text-slate-200">{{ data.bonus_effectiveness.summary.avg_normal_overall }}/g</strong>
                    </span>
                    <span class="px-2.5 py-1 rounded-lg font-mono font-bold"
                          :class="data.bonus_effectiveness.summary.lift_pct_overall >= 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'">
                        {{ data.bonus_effectiveness.summary.lift_pct_overall >= 0 ? '+' : '' }}{{ data.bonus_effectiveness.summary.lift_pct_overall }}%
                    </span>
                </div>
            </div>
            <div v-if="!data.bonus_effectiveness.games.length" class="text-xs text-slate-500">Nessun gioco bonus o nuovo gioco registrato nel periodo.</div>
            <div v-else class="overflow-x-auto max-h-80 overflow-y-auto">
                <table class="w-full text-xs text-left">
                    <thead class="text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="py-2">Gioco</th>
                            <th class="py-2">Tipo</th>
                            <th class="py-2 text-right">Gg Bonus</th>
                            <th class="py-2 text-right">Giocate Bonus</th>
                            <th class="py-2 text-right">Media Bonus/g</th>
                            <th class="py-2 text-right">Media Normale/g</th>
                            <th class="py-2 text-right">Lift</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60">
                        <tr v-for="g in data.bonus_effectiveness.games" :key="g.game" class="hover:bg-slate-800/40">
                            <td class="py-2 font-semibold text-slate-100">{{ g.emoji }} {{ g.game }}</td>
                            <td class="py-2">
                                <span v-for="t in g.bonus_types" :key="t"
                                      class="px-1.5 py-0.5 rounded font-mono text-[10px] mr-1"
                                      :class="t === 'new_game' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-amber-500/20 text-amber-300'">
                                    {{ t === 'new_game' ? 'nuovo' : 'jolly' }}
                                </span>
                                <span class="font-mono text-[10px] text-slate-400">x{{ g.max_multiplier }}</span>
                            </td>
                            <td class="py-2 text-right font-mono text-slate-300">{{ g.bonus_days }}</td>
                            <td class="py-2 text-right font-mono text-amber-300">{{ g.bonus_plays }}</td>
                            <td class="py-2 text-right font-mono font-bold text-slate-100">{{ g.avg_bonus }}</td>
                            <td class="py-2 text-right font-mono text-slate-400">{{ g.avg_normal }}</td>
                            <td class="py-2 text-right font-mono font-bold"
                                :class="g.lift_pct >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                                {{ g.lift_pct >= 0 ? '+' : '' }}{{ g.lift_pct }}%
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Users & Recent Events -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <h2 class="text-base font-bold mb-3">Utenti più attivi</h2>
                <div v-if="!data.top_users.length" class="text-xs text-slate-500">Nessun dato utente nel periodo.</div>
                <div v-else class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="text-slate-400 border-b border-slate-800">
                            <tr>
                                <th class="py-2">Utente</th>
                                <th class="py-2 text-right">Cmd</th>
                                <th class="py-2 text-right">Btn</th>
                                <th class="py-2 text-right">Giochi</th>
                                <th class="py-2 text-right">Picco</th>
                                <th class="py-2 text-right">Ultimo</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/60">
                            <tr v-for="u in data.top_users" :key="u.user_id"
                                @click="selectUser(u)"
                                class="cursor-pointer hover:bg-slate-800/50 transition"
                                :class="selectedUser && selectedUser.user_id === u.user_id ? 'bg-indigo-950/50' : ''">
                                <td class="py-2 font-semibold text-indigo-300 hover:underline">{{ u.name }}</td>
                                <td class="py-2 text-right font-mono text-sky-400">{{ u.commands }}</td>
                                <td class="py-2 text-right font-mono text-amber-400">{{ u.callbacks }}</td>
                                <td class="py-2 text-right font-mono text-emerald-400">{{ u.scores }}</td>
                                <td class="py-2 text-right font-mono text-indigo-300">{{ u.peak_hour || '—' }}</td>
                                <td class="py-2 text-right font-mono text-slate-400">{{ u.last_seen }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <h2 class="text-base font-bold">Eventi Recenti</h2>
                    <select v-model="eventFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-semibold">
                        <option value="all">Tutti</option>
                        <option value="command">Comandi</option>
                        <option value="callback">Callback</option>
                        <option value="score">Giocate</option>
                        <option value="error">Errori</option>
                    </select>
                </div>
                <div class="space-y-1.5 max-h-80 overflow-y-auto pr-1">
                    <div v-for="(ev, idx) in filteredEvents" :key="idx" class="flex items-center justify-between gap-2 bg-slate-950/60 border border-slate-800/80 rounded-xl px-3 py-2 text-xs">
                        <div class="min-w-0">
                            <span class="px-1.5 py-0.5 rounded font-mono text-[10px] mr-1.5" :class="badgeClass(ev.event_type)">{{ ev.event_type }}</span>
                            <button v-if="ev.user_id" @click="selectUser({ user_id: ev.user_id, name: ev.user_name })" class="font-semibold text-indigo-300 hover:underline">{{ ev.user_name }}</button>
                            <span v-else class="font-semibold text-slate-200">{{ ev.user_name }}</span>
                            <span class="text-slate-400 mx-1">→</span>
                            <span class="font-mono text-slate-100">{{ ev.name }}</span>
                            <span v-if="ev.detail" class="text-slate-500 ml-1 truncate">({{ ev.detail }})</span>
                        </div>
                        <span class="font-mono text-[10px] text-slate-500 shrink-0">{{ ev.time_str.slice(5, 16) }}</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Selected User Events Drilldown -->
        <section v-if="selectedUser" id="user-events-panel" class="bg-slate-900 border border-indigo-500/40 rounded-2xl p-5 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                    <h2 class="text-base font-bold text-indigo-300">Dettaglio Eventi: {{ selectedUser.name }}</h2>
                    <p class="text-xs text-slate-400">Ultimi {{ days }} giorni (max 200 eventi, dal più recente)</p>
                </div>
                <div class="flex items-center gap-2">
                    <select v-model="userEventFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-semibold">
                        <option value="all">Tutti ({{ userEvents.length }})</option>
                        <option value="command">Comandi</option>
                        <option value="callback">Callback</option>
                        <option value="score">Giocate</option>
                        <option value="error">Errori</option>
                    </select>
                    <button @click="selectedUser = null" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">✕ Chiudi</button>
                </div>
            </div>
            <div v-if="loadingUserEvents" class="text-xs text-slate-400 py-4">Caricamento eventi...</div>
            <div v-else class="space-y-3">
                <div v-if="userHourlyCounts.some(v => v > 0)" class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 space-y-2">
                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                        <span class="font-semibold text-slate-300">Orari di picco ({{ days }}g)</span>
                        <div class="flex flex-wrap gap-1.5">
                            <span v-for="pk in userPeakHours" :key="pk.hour" class="px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 font-mono text-[11px]">
                                {{ pk.label }} ({{ pk.count }})
                            </span>
                        </div>
                    </div>
                    <div class="grid grid-cols-[repeat(24,minmax(0,1fr))] gap-1 items-end h-14 pt-1">
                        <div v-for="(cnt, h) in userHourlyCounts" :key="h"
                             class="flex flex-col items-center justify-end h-full"
                             :title="`${String(h).padStart(2, '0')}:00 — ${cnt} eventi`">
                            <div class="w-full rounded-t transition-all"
                                 :class="userPeakHours.length && h === userPeakHours[0].hour ? 'bg-indigo-400' : (cnt > 0 ? 'bg-sky-500/60' : 'bg-slate-800/70')"
                                 :style="{ height: cnt > 0 ? Math.max(12, Math.round((cnt / maxUserHourVal) * 100)) + '%' : '3px' }">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-[repeat(24,minmax(0,1fr))] gap-1 text-[9px] font-mono text-slate-500 text-center">
                        <span v-for="h in 24" :key="h">{{ (h - 1) % 3 === 0 ? String(h - 1).padStart(2, '0') : '' }}</span>
                    </div>
                </div>
                <div v-if="!filteredUserEvents.length" class="text-xs text-slate-500 py-2">Nessun evento trovato.</div>
                <div v-else class="space-y-1.5 max-h-96 overflow-y-auto pr-1">
                    <div v-for="(ev, idx) in filteredUserEvents" :key="idx" class="flex items-center justify-between gap-2 bg-slate-950/60 border border-slate-800/80 rounded-xl px-3 py-2 text-xs">
                        <div class="min-w-0">
                            <span class="px-1.5 py-0.5 rounded font-mono text-[10px] mr-1.5" :class="badgeClass(ev.event_type)">{{ ev.event_type }}</span>
                            <span class="font-mono text-slate-100 font-semibold">{{ ev.name }}</span>
                            <span v-if="ev.detail" class="text-slate-400 ml-1.5">({{ ev.detail }})</span>
                        </div>
                        <span class="font-mono text-[11px] text-slate-400 shrink-0">{{ ev.time_str }}</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Recent Errors -->
        <section id="errors-panel" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
            <h2 class="text-base font-bold text-rose-300">Errori Recenti ({{ data.recent_errors.length }})</h2>
            <div v-if="!data.recent_errors.length" class="text-xs text-slate-500">Nessun errore registrato nel periodo.</div>
            <div v-else class="overflow-x-auto max-h-72 overflow-y-auto">
                <table class="w-full text-xs text-left">
                    <thead class="text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="py-2">Data / Ora</th>
                            <th class="py-2">Tipo</th>
                            <th class="py-2">Utente</th>
                            <th class="py-2">Messaggio</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60">
                        <tr v-for="(er, idx) in data.recent_errors" :key="idx">
                            <td class="py-2 font-mono text-slate-400 whitespace-nowrap pr-4">{{ er.time_str }}</td>
                            <td class="py-2 font-mono text-rose-400 font-semibold pr-4">{{ er.name }}</td>
                            <td class="py-2 text-slate-300 pr-4">{{ er.user_name }}</td>
                            <td class="py-2 font-mono text-slate-400">{{ er.detail || '—' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </template>
</div>

<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            token: localStorage.getItem('giochini_admin_token') || '',
            tokenInput: '',
            authenticated: false,
            authError: '',
            days: 30,
            data: null,
            eventFilter: 'all',
            selectedUser: null,
            userEvents: [],
            userHourlyCounts: Array(24).fill(0),
            userPeakHours: [],
            userEventFilter: 'all',
            loadingUserEvents: false,
            selectedCommand: null,
            commandEvents: [],
            loadingCommandEvents: false,
            dayLabels: ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'],
            heatPalette: [
                '#450a0a',
                '#7f1d1d',
                '#b91c1c',
                '#dc2626',
                '#ea580c',
                '#f59e0b',
                '#eab308',
                '#facc15',
                '#84cc16',
                '#22c55e',
            ],
        };
    },
    computed: {
        maxDailyTotal() {
            if (!this.data || !this.data.daily_series.length) return 1;
            return Math.max(1, ...this.data.daily_series.map(d => d.commands + d.callbacks + d.scores));
        },
        maxHeatVal() {
            if (!this.data) return 1;
            return Math.max(1, ...this.data.hourly_heatmap.flat());
        },
        maxUserHourVal() {
            return Math.max(1, ...this.userHourlyCounts);
        },
        filteredEvents() {
            if (!this.data) return [];
            if (this.eventFilter === 'all') return this.data.recent_events;
            return this.data.recent_events.filter(e => e.event_type === this.eventFilter);
        },
        filteredUserEvents() {
            if (this.userEventFilter === 'all') return this.userEvents;
            return this.userEvents.filter(e => e.event_type === this.userEventFilter);
        },
    },
    methods: {
        async login() {
            this.authError = '';
            this.token = this.tokenInput.trim();
            const ok = await this.fetchOverview();
            if (ok) {
                localStorage.setItem('giochini_admin_token', this.token);
            } else {
                localStorage.removeItem('giochini_admin_token');
                this.token = '';
            }
        },
        logout() {
            localStorage.removeItem('giochini_admin_token');
            this.token = '';
            this.tokenInput = '';
            this.authenticated = false;
            this.data = null;
        },
        async fetchOverview() {
            if (!this.token) return false;
            try {
                const res = await fetch(`/api/admin/overview/?days=${this.days}`, {
                    headers: { 'X-Admin-Token': this.token },
                });
                if (res.status === 401) {
                    this.authenticated = false;
                    this.authError = 'Token non valido.';
                    return false;
                }
                if (!res.ok) return false;
                this.data = await res.json();
                this.authenticated = true;
                if (this.selectedUser) {
                    this.fetchUserEvents(this.selectedUser.user_id);
                }
                if (this.selectedCommand) {
                    this.fetchCommandEvents(this.selectedCommand.name, this.selectedCommand.event_type);
                }
                return true;
            } catch (e) {
                this.authError = 'Errore di rete.';
                return false;
            }
        },
        selectUser(u) {
            this.selectedUser = u;
            this.userEventFilter = 'all';
            this.fetchUserEvents(u.user_id);
            this.$nextTick(() => {
                const el = document.getElementById('user-events-panel');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        },
        async fetchUserEvents(userId) {
            if (!this.token || !userId) return;
            this.loadingUserEvents = true;
            try {
                const res = await fetch(`/api/admin/user-events/?user_id=${userId}&days=${this.days}`, {
                    headers: { 'X-Admin-Token': this.token },
                });
                if (res.ok) {
                    const payload = await res.json();
                    this.userEvents = payload.events || [];
                    this.userHourlyCounts = payload.hourly_counts || Array(24).fill(0);
                    this.userPeakHours = payload.peak_hours || [];
                }
            } finally {
                this.loadingUserEvents = false;
            }
        },
        selectCommand(name, eventType) {
            this.selectedCommand = { name, event_type: eventType };
            this.fetchCommandEvents(name, eventType);
            this.$nextTick(() => {
                const el = document.getElementById('command-events-panel');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        },
        async fetchCommandEvents(name, eventType) {
            if (!this.token || !name) return;
            this.loadingCommandEvents = true;
            try {
                const res = await fetch(`/api/admin/command-events/?name=${encodeURIComponent(name)}&event_type=${encodeURIComponent(eventType)}&days=${this.days}`, {
                    headers: { 'X-Admin-Token': this.token },
                });
                if (res.ok) {
                    const payload = await res.json();
                    this.commandEvents = payload.events || [];
                }
            } finally {
                this.loadingCommandEvents = false;
            }
        },
        focusErrors() {
            const el = document.getElementById('errors-panel');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        },
        barHeight(val) {
            return `${Math.round((val / this.maxDailyTotal) * 100)}%`;
        },
        heatColor(val) {
            if (!val) return '#05070c';
            const ratio = val / this.maxHeatVal;
            const idx = Math.min(this.heatPalette.length - 1, Math.max(0, Math.ceil(ratio * this.heatPalette.length) - 1));
            return this.heatPalette[idx];
        },
        slotLabel(sIdx) {
            const hh = String(Math.floor(sIdx / 2)).padStart(2, '0');
            const mm = sIdx % 2 === 0 ? '00' : '30';
            return `${hh}:${mm}`;
        },
        badgeClass(t) {
            if (t === 'command') return 'bg-sky-500/20 text-sky-300';
            if (t === 'callback') return 'bg-amber-500/20 text-amber-300';
            if (t === 'score') return 'bg-emerald-500/20 text-emerald-300';
            return 'bg-rose-500/20 text-rose-300';
        },
    },
    mounted() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) {
            this.token = params.get('token');
            localStorage.setItem('giochini_admin_token', this.token);
        }
        if (this.token) {
            this.fetchOverview();
        }
    }
}).mount('#app');
</script>
</body>
</html>
